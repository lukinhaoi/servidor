name: Build Missao Evoluir APK

on:
  push:
    branches:
      - build-missao-evoluir-apk
    paths:
      - "Missao_Evoluir_Android_Nativo_v5.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract native Android project
        run: |
          unzip -t Missao_Evoluir_Android_Nativo_v5.zip
          unzip -q Missao_Evoluir_Android_Nativo_v5.zip

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p missao_evoluir_android :app:assembleDebug

      - name: Verify APK
        run: |
          test -s missao_evoluir_android/app/build/outputs/apk/debug/app-debug.apk
          file missao_evoluir_android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: missao-evoluir-android15-apk
          path: missao_evoluir_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

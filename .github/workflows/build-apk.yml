name: Build Missao Evoluir APK

on:
  push:
    branches:
      - build-missao-evoluir-apk
    paths:
      - "Missao_Evoluir_Android_Nativo_v5.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract native Android project
        run: unzip -q Missao_Evoluir_Android_Nativo_v5.zip

      - name: Build debug APK
        run: gradle --no-daemon -p missao_evoluir_android :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: missao-evoluir-android15-apk
          path: missao_evoluir_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
